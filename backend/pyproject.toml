[project]
name = "dca-backend"
version = "0.1.0"
description = "Dispute claim agent automation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=43",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "anthropic[bedrock]>=0.34",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp>=1.27,<2",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "hypothesis>=6",
  "respx>=0.21", "moto>=5", "ruff>=0.6", "mypy>=1.11", "import-linter>=2",
  "pip-audit>=2.7", "checkov>=3", "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dca", "src/dca_vault", "src/dca_mocks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
